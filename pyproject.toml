[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0.post0"
description = "Hybrid/Sovereign AI Orchestration Plane — P0 category proof"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "cryptography==46.0.5",
    "psycopg[binary]==3.2.10",
    "python-multipart==0.0.12",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
include = ["orchestra*"]
exclude = ["tests*", "data*", "docs*", "tmp*", "output*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests requiring a running PG",
    "smoke: lightweight smoke tests",
]
